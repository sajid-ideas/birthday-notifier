name: Daily birthday notifier

on:
  schedule:
    # 18:30 UTC = 00:00 IST (India time). GitHub may start a few minutes late;
    # the app always works out "today" in Asia/Kolkata, so the right birthday is still picked.
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Pretend today is this date (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""
      dry_run:
        description: "Dry run: print the messages instead of sending them"
        type: boolean
        default: true

concurrency:
  group: birthday-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B -q package

      - name: Check the family list secret
        env:
          MEMBERS_CSV: ${{ secrets.MEMBERS_CSV }}
        run: |
          if [ -z "$MEMBERS_CSV" ]; then
            echo "::error::The MEMBERS_CSV secret is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Send birthday messages
        env:
          MEMBERS_CSV: ${{ secrets.MEMBERS_CSV }}
          # Scheduled runs always send for real; manual runs follow the checkbox.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          DATE_OVERRIDE: ${{ inputs.date }}
          TIMEZONE: Asia/Kolkata
        run: java -jar target/birthday-notifier.jar
